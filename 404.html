<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NOLA Tour Director</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #5e665f;
      --line: #d9dfda;
      --paper: #fbfaf6;
      --panel: #fffefb;
      --green: #286655;
      --green-2: #17483d;
      --gold: #b8872e;
      --red: #8b3f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.35;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 254, 251, 0.97);
      backdrop-filter: blur(10px);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }
    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.05;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 4px;
      font-size: 18px;
      letter-spacing: 0;
    }
    p { margin: 0 0 9px; }
    .muted { color: var(--muted); }
    .panel, .stop {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .panel {
      padding: 13px;
      margin-bottom: 12px;
    }
    .unlock-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 10px;
    }
    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 11px;
      font: inherit;
      font-size: 18px;
      background: #fff;
    }
    button, a.button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button.primary, a.primary {
      color: #fff;
      border-color: var(--green);
      background: var(--green);
    }
    a.android {
      color: #fff;
      border-color: var(--green-2);
      background: var(--green-2);
    }
    button.warn {
      color: #fff;
      border-color: var(--red);
      background: var(--red);
    }
    .people {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 29px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7f9f7;
      font-size: 13px;
      font-weight: 800;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .stop {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .num {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: #fff;
      border-radius: 50%;
      background: var(--green);
      font-weight: 900;
    }
    .assignment {
      min-height: 23px;
      margin: 8px 0;
      color: var(--gold);
      font-weight: 900;
    }
    .actions {
      display: grid;
      gap: 8px;
    }
    .sms-actions {
      display: none;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .message-preview {
      display: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f7f5ee;
      font-size: 13px;
      color: #29312d;
    }
    .ready .sms-actions,
    .ready .message-preview {
      display: grid;
    }
    .hide { display: none; }
    .error {
      margin-top: 8px;
      color: var(--red);
      font-weight: 800;
    }
  </style>
</head>
<body>
  <header>
    <h1>NOLA Tour Director</h1>
    <p class="muted">Street mode: unlock, tap a stop, open Messages.</p>
  </header>
  <main>
    <section class="panel" id="unlockPanel">
      <strong>Unlock tour controls</strong>
      <p class="muted">This keeps the phone numbers out of the public page source.</p>
      <div class="unlock-row">
        <input id="code" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="unlock code">
        <button class="primary" id="unlock" type="button">Unlock</button>
      </div>
      <div class="error" id="error"></div>
    </section>
    <section class="panel hide" id="castPanel">
      <strong>Trip Cast</strong>
      <div class="people" id="people"></div>
      <div class="toolbar">
        <button class="warn" id="reset" type="button">Reset assignments</button>
      </div>
    </section>
    <section id="stops"></section>
  </main>

    const stateKey = "nola-tour-director-street-v1";

    function b64ToBytes(value) {
      return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    }

    async function decryptPayload(code) {
      const baseKey = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(code),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(encrypted.salt), iterations: 210000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const cipher = b64ToBytes(encrypted.ciphertext);
      const tag = b64ToBytes(encrypted.tag);
      const combined = new Uint8Array(cipher.length + tag.length);
      combined.set(cipher);
      combined.set(tag, cipher.length);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(encrypted.iv) },
        key,
        combined
      );
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(stateKey)) || { assignments: {}, used: [] };
      } catch {
        return { assignments: {}, used: [] };
      }
    }

    function saveState(state) {
      localStorage.setItem(stateKey, JSON.stringify(state));
    }

    function nextPerson(state, people) {
      let pool = people.filter((person) => !state.used.includes(person.name));
      if (!pool.length) {
        state.used = [];
        pool = people.slice();
      }
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function smsBody(stop) {
      return [
        "You're up for Stop " + stop.n + ": " + stop.title + ".",
        "Character: " + stop.character + ".",
        "Script:\n" + stop.script.join("\n"),
        "Performance prompt: " + stop.prompt,
        "Read it out loud and make it fun."
      ].join("\n\n");
    }

    function smsUrl(person, body) {
      return "sms:" + person.phone + "?body=" + encodeURIComponent(body);
    }

    function smstoUrl(person, body) {
      return "smsto:" + person.phone + "?body=" + encodeURIComponent(body);
    }

    function androidIntent(person, body) {
      const phone = person.phone.replace(/^\+/, "");
      return "intent://send/" + phone + "#Intent;scheme=smsto;package=com.google.android.apps.messaging;S.sms_body=" + encodeURIComponent(body) + ";end";
    }

    function render(data) {
      document.getElementById("unlockPanel").classList.add("hide");
      document.getElementById("castPanel").classList.remove("hide");
      document.getElementById("people").innerHTML = data.people
        .map((person) => '<span class="pill">' + person.name + '</span>')
        .join("");

      document.getElementById("stops").innerHTML = data.stops.map((stop) => (
        '<article class="stop" id="stop-' + stop.n + '">' +
          '<div class="num">' + stop.n + '</div>' +
          '<div>' +
            '<h2>' + stop.title + '</h2>' +
            '<p class="muted">' + stop.address + ' | ' + stop.character + '</p>' +
            '<div class="assignment" id="assignment-' + stop.n + '"></div>' +
            '<div class="actions">' +
              '<button class="primary assign" type="button" data-stop="' + stop.n + '">Assign + open text</button>' +
              '<div class="sms-actions" id="sms-actions-' + stop.n + '">' +
                '<a class="button primary" id="sms-' + stop.n + '" href="#">Open Messages</a>' +
                '<a class="button android" id="android-' + stop.n + '" href="#">Android direct</a>' +
                '<a class="button" id="smsto-' + stop.n + '" href="#">Backup SMS link</a>' +
              '</div>' +
              '<div class="message-preview" id="preview-' + stop.n + '"></div>' +
            '</div>' +
          '</div>' +
        '</article>'
      )).join("");

      function assign(stopNumber, openImmediately) {
        const stop = data.stops.find((item) => item.n === stopNumber);
        const state = loadState();
        const person = state.assignments[stop.n]
          ? data.people.find((item) => item.name === state.assignments[stop.n])
          : nextPerson(state, data.people);
        state.assignments[stop.n] = person.name;
        if (!state.used.includes(person.name)) state.used.push(person.name);
        saveState(state);

        const body = smsBody(stop);
        const card = document.getElementById("stop-" + stop.n);
        card.classList.add("ready");
        document.getElementById("assignment-" + stop.n).textContent = "Assigned to " + person.name;
        document.getElementById("preview-" + stop.n).textContent = body;
        document.getElementById("sms-" + stop.n).href = smsUrl(person, body);
        document.getElementById("android-" + stop.n).href = androidIntent(person, body);
        document.getElementById("smsto-" + stop.n).href = smstoUrl(person, body);
        if (openImmediately) {
          window.location.href = smsUrl(person, body);
        }
      }

      data.stops.forEach((stop) => {
        document.querySelector('[data-stop="' + stop.n + '"]').addEventListener("click", () => assign(stop.n, true));
      });

      const state = loadState();
      Object.keys(state.assignments || {}).forEach((stopNumber) => assign(Number(stopNumber), false));

      document.getElementById("reset").addEventListener("click", () => {
        localStorage.removeItem(stateKey);
        location.reload();
      });
    }

    document.getElementById("unlock").addEventListener("click", async () => {
      const code = document.getElementById("code").value.trim();
      const error = document.getElementById("error");
      error.textContent = "";
      try {
        const data = await decryptPayload(code);
        sessionStorage.setItem("nola-tour-data", JSON.stringify(data));
        render(data);
      } catch {
        error.textContent = "Wrong code. Try again.";
      }
    });

    document.getElementById("code").addEventListener("keydown", (event) => {
      if (event.key === "Enter") document.getElementById("unlock").click();
    });

    try {
      const cached = JSON.parse(sessionStorage.getItem("nola-tour-data") || "null");
      if (cached) render(cached);
    } catch {}

    const hashCode = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
    if (hashCode && !sessionStorage.getItem("nola-tour-data")) {
      document.getElementById("code").value = hashCode;
      document.getElementById("unlock").click();
    }
  </script>
</body>
</html>
